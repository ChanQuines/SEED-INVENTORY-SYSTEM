{% extends "base.html" %}

{% block title %}Admin Edit Seed{% endblock %}

{% block content %}
<div class="card max-w-2xl mx-auto">
    <h1 class="page-title">Edit Inventory Item</h1>
    <p class="page-subtitle">You are editing **Heirloom Tomato - Cherokee Purple** (ID: 123). Changes will instantly update the public inventory.</p>

    <form method="POST">
        <div class="form-group">
            <label for="seed_name">Seed Name</label>
            <input type="text" id="seed_name" name="seed_name" value="Heirloom Tomato - Cherokee Purple" required>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label for="quantity">Current Quantity (Units)</label>
                <input type="number" id="quantity" name="quantity" required min="0" value="450">
            </div>
        
            <div class="form-group">
                <label for="supplier">Supplier / Source</label>
                <input type="text" id="supplier" name="supplier" value="Local Farm X">
            </div>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Available" selected>Available</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
                <option value="Expired">Expired</option>
            </select>
        </div>

        <div class="form-group mt-10 flex justify-between items-center">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary-sm" style="background-color: #FEEEEE; color: var(--color-danger-dark);">Delete Item</button>
        </div>
        
        <p class="text-secondary-text text-sm text-center mt-4">Last modified by Admin User on 2025-11-21.</p>
    </form>
</div>
{% endblock %}
