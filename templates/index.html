<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robust System Monitor</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0f172a', /* slate-900 */
                        'brand-primary': '#4f46e5', /* indigo-600 */
                        'brand-accent': '#8b5cf6', /* violet-500 */
                        'success': '#10b981', /* emerald-500 */
                        'error': '#ef4444', /* red-500 */
                        'warning': '#f59e0b', /* amber-500 */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        /* Custom scrollbar for log area */
        #log-output::-webkit-scrollbar {
            width: 6px;
        }
        #log-output::-webkit-scrollbar-thumb {
            background-color: #334155; /* slate-700 */
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- Header & Auth Status - Centered and Clean -->
    <header class="w-full max-w-6xl mb-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-xl shadow-2xl border-t-4 border-brand-primary">
            <h1 class="text-3xl font-extrabold text-brand-dark mb-2 sm:mb-0">
                System Monitor <span class="text-brand-primary">V1.0</span>
            </h1>
            <div id="auth-status" class="flex items-center space-x-3 bg-slate-50 p-2 rounded-lg shadow-inner">
                <span id="auth-indicator" class="w-4 h-4 rounded-full bg-gray-400 animate-pulse"></span>
                <span id="user-id" class="text-xs font-medium text-slate-600 truncate max-w-[180px]">Authenticating...</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid - Centered and Responsive -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- System Status Card (Col 1) -->
        <div id="status-card" class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg border-l-4 border-brand-primary transform hover:scale-[1.02] transition duration-300">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-brand-dark">Service Health</h2>
                <!-- Icon: Lucide "Activity" equivalent via SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-primary"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>

            <p class="text-lg text-slate-500 mb-2">Primary Service Status:</p>
            <span id="service-status" class="inline-block px-4 py-2 text-xl font-extrabold rounded-lg shadow-md bg-warning text-white transition-colors duration-500">PENDING</span>

            <div class="mt-6 pt-4 border-t border-slate-200">
                <p class="text-sm text-slate-400">Last heartbeat:</p>
                <span id="last-updated" class="text-sm font-medium text-slate-600">--</span>
            </div>
        </div>

        <!-- Data Log Card (Col 2 & 3 - Wider on Desktop) -->
        <div class="lg:col-span-2 bg-brand-dark p-6 rounded-xl shadow-2xl border-l-4 border-brand-accent">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-white">Live System Logs (Top 5)</h2>
                <!-- Icon: Lucide "Terminal" equivalent via SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-accent"><polyline points="4 17 9 22 14 17"/><line x1="12" y1="12" x2="12" y2="22"/></svg>
            </div>

            <div id="log-output" class="h-48 overflow-y-auto bg-slate-800 p-4 rounded-lg text-sm font-mono text-success shadow-inner">
                <p>Waiting for database connection...</p>
            </div>

            <button id="add-data-btn" class="mt-4 w-full bg-brand-primary hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 ease-in-out shadow-lg hover:shadow-xl disabled:opacity-30 disabled:cursor-not-allowed transform hover:scale-[1.01]" disabled>
                🚀 Add Diagnostic Log Entry
            </button>
        </div>

    </main>

    <!-- Firestore Script Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            addDoc,
            onSnapshot,
            collection,
            query,
            limit,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL CONFIGURATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- UI Elements ---
        const authIndicator = document.getElementById('auth-indicator');
        const userIdSpan = document.getElementById('user-id');
        const serviceStatusSpan = document.getElementById('service-status');
        const lastUpdatedSpan = document.getElementById('last-updated');
        const logOutput = document.getElementById('log-output');
        const addDataBtn = document.getElementById('add-data-btn');

        let db;
        let auth;
        let currentUserId = null;
        let isAuthReady = false;

        /**
         * Initializes Firebase and authenticates the user.
         */
        async function initializeFirebase() {
            try {
                // Initialize Firebase App
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // 1. Listen for auth state changes
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        userIdSpan.textContent = `User: ${currentUserId}`;
                        authIndicator.className = 'w-4 h-4 rounded-full bg-success';
                        isAuthReady = true;
                        addDataBtn.disabled = false;
                        console.log("SUCCESS: User authenticated and Firestore ready. User ID:", currentUserId);

                        // Start real-time data monitoring only after auth is confirmed
                        startDataMonitoring();
                        setupTestDataListener();
                    } else {
                        currentUserId = null;
                        userIdSpan.textContent = 'Signed Out';
                        authIndicator.className = 'w-4 h-4 rounded-full bg-error';
                        isAuthReady = true;
                        addDataBtn.disabled = true;
                        console.log("INFO: User signed out or authentication pending.");
                    }
                });

                // 2. Perform initial sign-in attempt
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    // Fallback to anonymous sign-in
                    await signInAnonymously(auth);
                }

            } catch (error) {
                console.error("ERROR: Firebase Initialization or Auth Failure:", error);
                userIdSpan.textContent = `Error: ${error.code || error.message}`;
                authIndicator.className = 'w-4 h-4 rounded-full bg-error';
            }
        }

        /**
         * Sets up a real-time listener for the main system status document (using private path).
         */
        function startDataMonitoring() {
            if (!isAuthReady || !currentUserId || !db) return;

            // Using the user's private path for guaranteed security rule access
            const statusDocPath = `artifacts/${appId}/users/${currentUserId}/systemStatus/main`;
            const statusDocRef = doc(db, statusDocPath);

            console.log("Attempting to connect to status path:", statusDocPath);

            onSnapshot(statusDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // Determine status color and class
                    let statusClass, statusText = data.status || 'UNKNOWN';
                    if (statusText === 'OPERATIONAL') {
                        statusClass = 'bg-success';
                    } else if (statusText === 'DEGRADED') {
                        statusClass = 'bg-warning text-gray-800';
                    } else {
                        statusClass = 'bg-error';
                    }

                    // Update UI
                    serviceStatusSpan.textContent = statusText;
                    serviceStatusSpan.className = `inline-block px-4 py-2 text-xl font-extrabold rounded-lg shadow-md ${statusClass} text-white transition-colors duration-500`;

                    const timestamp = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString() : 'N/A';
                    lastUpdatedSpan.textContent = timestamp;
                    console.log("SUCCESS: Received status update:", statusText);
                } else {
                    // If document doesn't exist, create it with initial status
                    console.log("System status document not found. Initializing...");
                    setDoc(statusDocRef, {
                        status: 'OPERATIONAL',
                        message: 'System initialization complete.',
                        timestamp: serverTimestamp()
                    }).catch(e => console.error("Error writing initial document:", e));
                }
            }, (error) => {
                console.error("ERROR: System Status Listener Failed:", error);
                serviceStatusSpan.textContent = 'ERROR';
                serviceStatusSpan.className = 'inline-block px-4 py-2 text-xl font-extrabold rounded-lg shadow-md bg-error text-white';
            });
        }

        /**
         * Sets up a real-time listener for test log entries, sorting client-side.
         */
        function setupTestDataListener() {
            if (!isAuthReady || !currentUserId || !db) return;

            // Using the user's private path for guaranteed security rule access
            const logCollectionPath = `artifacts/${appId}/users/${currentUserId}/systemLogs`;
            const logCollectionRef = collection(db, logCollectionPath);

            console.log("Attempting to connect to log path:", logCollectionPath);

            // Query without orderBy to prevent indexing errors, limiting the documents fetched
            // We use client-side sorting instead.
            const q = query(logCollectionRef, limit(10));

            onSnapshot(q, (snapshot) => {
                let logs = [];
                snapshot.forEach((doc) => {
                    logs.push({ id: doc.id, ...doc.data() });
                });

                // Client-side sorting (newest first)
                logs.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.toDate().getTime() : 0;
                    const timeB = b.timestamp ? b.timestamp.toDate().getTime() : 0;
                    return timeB - timeA;
                });

                logOutput.innerHTML = ''; // Clear existing logs
                if (logs.length > 0) {
                    // Display the latest 5 logs
                    logs.slice(0, 5).forEach((log) => {
                        const logTime = log.timestamp ? new Date(log.timestamp.toDate()).toLocaleTimeString() : 'N/A';
                        const logEntry = document.createElement('p');
                        logEntry.className = 'py-0.5 text-xs sm:text-sm whitespace-nowrap overflow-hidden text-ellipsis';
                        logEntry.textContent = `> [${logTime}] ${log.message}`;
                        logOutput.appendChild(logEntry);
                    });
                     console.log(`SUCCESS: Received ${logs.length} log entries.`);
                } else {
                     logOutput.innerHTML = '<p class="text-slate-500 text-xs">No log entries yet. Click the button below to add one.</p>';
                }
                // Scroll to the bottom of the log
                logOutput.scrollTop = logOutput.scrollHeight;

            }, (error) => {
                console.error("ERROR: Log Listener Failed:", error);
                logOutput.innerHTML = '<p class="text-error text-xs">Failed to load logs due to connection error.</p>';
            });

            // Add listener for the button to post new data
            addDataBtn.onclick = async () => {
                if (!currentUserId) {
                    console.warn("Cannot add data: User not authenticated.");
                    return;
                }
                try {
                    await addDoc(logCollectionRef, {
                        message: `System diagnostic check initiated. Code: ${Math.random().toString(36).substring(2, 6).toUpperCase()}`,
                        timestamp: serverTimestamp()
                    });
                    console.log("Test log added successfully.");
                } catch (e) {
                    console.error("Error adding test log:", e);
                }
            };
        }

        // Start the application setup when the script runs
        initializeFirebase();

    </script>
</body>
</html>
