{% extends "base.html" %}

{% block title %}System Access{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card login-form-card">
        <div class="page-title" style="justify-content: center; margin-bottom: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            System Access
        </div>
        <div class="page-subtitle" style="margin-bottom: 2.5rem;">
            Please log in to your Seeds Life account.
        </div>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
