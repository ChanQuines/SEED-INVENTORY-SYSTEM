{% extends 'base.html' %}
{% block title %}Status Overview{% endblock %}
{% block content %}

<h3 class="text-success mb-4">📊 Seed Status Overview</h3>

<div class="row text-center">
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm p-4">
      <h5>Available</h5>
      <p class="display-6 text-success">{{ available_count }}</p>
    </div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm p-4">
      <h5>Low Stock</h5>
      <p class="display-6 text-warning">{{ low_stock_count }}</p>
    </div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm p-4">
      <h5>Expired</h5>
      <p class="display-6 text-danger">{{ expired_count }}</p>
    </div>
  </div>
</div>

{% endblock %}
