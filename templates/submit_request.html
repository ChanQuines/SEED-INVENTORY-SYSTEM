{% extends "base.html" %}

{% block title %}Submit New Request{% endblock %}

{% block content %}
<div class="card max-w-2xl mx-auto">
    <h1 class="page-title" style="text-align: center;">📝 Submit New Inventory Request</h1>
    <p class="page-subtitle" style="text-align: center;">Use this form to request a change to the inventory. All requests require Admin approval.</p>

    <form method="POST" action="{{ url_for('submit_request') }}" enctype="multipart/form-data" class="space-y-5">

        <div class="form-group">
            <label for="transaction_type">Request Type (Required)</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="Add">Add to Inventory (Found/Donated Seeds)</option>
                <option value="Withdraw">Withdraw from Inventory (Used/Discarded Seeds)</option>
            </select>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label for="seed_name">Seed Name (Required)</label>
                <input type="text" id="seed_name" name="seed_name" required placeholder="e.g., Cucumber - Straight Eight">
            </div>

            <div class="form-group">
                <label for="seed_type">Seed Type / Category</label>
                <input type="text" id="seed_type" name="seed_type" placeholder="e.g., Vegetable">
            </div>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label for="quantity">Quantity (Units) (Required)</label>
                <input type="number" id="quantity" name="quantity" required min="1" value="1" placeholder="Minimum 1 unit">
            </div>

            <div class="form-group">
                <label for="seed_image">Image Proof (Required for 'Add')</label>
                <input type="file" id="seed_image" name="seed_image" accept="image/*" style="padding: 0.6rem 1rem; border: 1px solid var(--color-border); border-radius: 0.5rem; width: 100%;">
            </div>
        </div>

        <div class="form-group">
            <label for="reason">Reason / Description (Required)</label>
            <textarea id="reason" name="reason" rows="3" required placeholder="Briefly explain the reason for adding or withdrawing this quantity."></textarea>
        </div>

        <div class="form-group mt-6">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request for Approval</button>
        </div>
    </form>
</div>
{% endblock %}
