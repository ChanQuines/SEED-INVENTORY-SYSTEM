{% extends 'base.html' %}
{% block title %}Update Seed{% endblock %}
{% block content %}

<div class="card mx-auto p-4" style="max-width: 600px;">
  <h4 class="text-center mb-3">✏️ Update Seed</h4>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Seed Name</label>
      <input type="text" class="form-control" value="{{ seed.seed_name }}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Seed Type</label>
      <input type="text" class="form-control" name="seed_type" value="{{ seed.seed_type }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Quantity</label>
      <input type="number" class="form-control" name="quantity" value="{{ seed.quantity }}" min="1" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Supplier</label>
      <input type="text" class="form-control" name="supplier" value="{{ seed.supplier }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select" name="status" required>
        <option value="Available" {% if seed.status == 'Available' %}selected{% endif %}>Available</option>
        <option value="Low Stock" {% if seed.status == 'Low Stock' %}selected{% endif %}>Low Stock</option>
        <option value="Expired" {% if seed.status == 'Expired' %}selected{% endif %}>Expired</option>
      </select>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary px-4">Update</button>
      <a href="{{ url_for('report') }}" class="btn btn-secondary px-4">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
